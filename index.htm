<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Equipamentos</title>
    <link rel="icon" type="png" href="logomarca.png">

    <style>
        body {
            background: url("fundo.png") no-repeat center center fixed;
            background-size: cover;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 360px;
            margin: 40px auto;
            background: rgba(255, 255, 255, 0.6); /* 60% transparência */
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
            text-align: center;
        }

        .logo {
            width: 120px;
        }

        .titulo {
            width: 260px;
            margin-top: 10px;
        }

        input {
            width: 95%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 8px;
            border: 1px solid #777;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            font-size: 18px;
            background: #005bbb;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        button:hover {
            background: #003f8a;
        }

        #limparBtn {
            background: #888;
        }

        #limparBtn:hover {
            background: #666;
        }

        .hidden {
            display: none;
        }

        #mensagemStatus {
            margin-top: 15px;
            font-weight: bold;
            font-size: 18px;
        }
    </style>

    <!-- Leitor de código de barras -->
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>

<body>

    <div class="container">

        <img src="logomarca.png" class="logo">
        <img src="titulo.png" class="titulo">

        <form id="equipamentoForm">

            <input type="text" id="nomeTecnico" placeholder="Nome do Técnico" required>

            <input type="text" id="protocolo" placeholder="Protocolo / SA" required>

            <!-- Leitor 1 -->
            <input type="text" id="codigoBarra1" placeholder="Clique para ler o primeiro código" readonly required>
            <button type="button" onclick="lerCodigo1()">📷 Ler Código 1</button>

            <!-- Pergunta para o segundo código -->
            <button type="button" id="pergunta2" class="hidden" onclick="mostrarLeitor2()">
                ➕ Ler Segundo Código?
            </button>

            <!-- Leitor 2 aparece somente se o usuário quiser -->
            <div id="areaCodigo2" class="hidden">
                <input type="text" id="codigoBarra2" placeholder="Clique para ler o segundo código" readonly>
                <button type="button" onclick="lerCodigo2()">📷 Ler Código 2</button>
            </div>

            <button type="submit">📨 Enviar</button>
            <button type="button" id="limparBtn" onclick="limparCampos()">🧹 Limpar</button>

            <div id="mensagemStatus"></div>
        </form>

        <!-- Janela do scanner -->
        <div id="reader" style="width: 320px; margin-top: 15px;"></div>
    </div>

<script>
/* -------------------------- CONFIGURAÇÃO DA API --------------------------- */
const API_URL = "https://ordemservico-65p7.onrender.com/ordens";

/* --------- Mostrar leitor 2 somente depois que escanear o primeiro -------- */
function mostrarLeitor2() {
    document.getElementById("areaCodigo2").classList.remove("hidden");
    document.getElementById("pergunta2").classList.add("hidden");
}

/* --------------------- Leitura do código 1 ---------------------- */
function lerCodigo1() {
    iniciarLeitor("codigoBarra1", () => {
        document.getElementById("pergunta2").classList.remove("hidden");
    });
}

/* --------------------- Leitura do código 2 ---------------------- */
function lerCodigo2() {
    iniciarLeitor("codigoBarra2");
}

/* --------------------- Função genérica do leitor ---------------------- */
function iniciarLeitor(idCampo, callback = null) {
    const html5QrCode = new Html5Qrcode("reader");

    html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: 250 },
        (decodedText) => {
            document.getElementById(idCampo).value = decodedText;
            html5QrCode.stop();
            if (callback) callback();
        }
    ).catch(err => {
        alert("Erro ao acessar a câmera: " + err);
    });
}

/* ------------------- Evento de envio do formulário ------------------- */
document.getElementById("equipamentoForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const dados = {
        tecnico: nomeTecnico.value,
        protocolo: protocolo.value,
        codigo1: codigoBarra1.value,
        codigo2: codigoBarra2.value || null
    };

    try {
        const resposta = await fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(dados)
        });

        if (resposta.ok) {
            mensagemStatus.style.color = "green";
            mensagemStatus.textContent = "✔ Dados enviados com sucesso!";
            limparCampos(false);
        } else {
            mensagemStatus.style.color = "red";
            mensagemStatus.textContent = "❌ Erro ao enviar dados!";
        }
    } catch {
        mensagemStatus.style.color = "red";
        mensagemStatus.textContent = "❌ Falha na conexão com a API!";
    }
});

/* ----------------------- Limpar todos os campos ----------------------- */
function limparCampos(apagarMensagem = true) {
    nomeTecnico.value = "";
    protocolo.value = "";
    codigoBarra1.value = "";
    codigoBarra2.value = "";

    document.getElementById("areaCodigo2").classList.add("hidden");
    document.getElementById("pergunta2").classList.add("hidden");

    if (apagarMensagem)
        mensagemStatus.textContent = "";
}

</script>

</body>
</html>
